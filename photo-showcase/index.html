<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Showcase</title>
    <meta name="description" content="A showcase of my photography work." />
  </head>
  <body>
    <header>
      <h1>Photo Showcase</h1>
    </header>
    <main>
      <section>
        <h2>Gallery</h2>
        <div class="gallery">
          <figure>
            <img
              src="images/photo1.jpg"
              width="400"
              height="300"
              alt="A New World Under The Water"
            />
            <figcaption>
              A peaceful mountain landscape photographed during winter.
            </figcaption>
          </figure>

          <figure>
            <img
              src="images/photo2.jpg"
              width="400"
              height="300"
              alt="A Beautiful Sunset"
            />
            <figcaption>A vibrant sunset over the ocean.</figcaption>
          </figure>
          <figure>
            <img
              src="images/photo3.jpg"
              width="400"
              height="300"
              alt="Mountain Landscape"
            />
            <figcaption>A scenic mountain view during autumn.</figcaption>
          </figure>
          <figure>
            <img
              src="images/photo4.jpg"
              width="400"
              height="300"
              alt="City Life"
            />
            <figcaption>Urban life in the bustling city.</figcaption>
          </figure>
          <img src="images/photo5.jpg" width="400" height="300" alt="" />
          <img
            src="images/photo6.jpg"
            width="400"
            height="300"
            alt="Beach Scene"
          />
        </div>
      </section>
      <section>
        <h2>About the Photographer</h2>
        <p>
          Hello! I'm a passionate photographer who loves capturing moments and
          telling stories through images. This showcase features some of my
          favorite works.
        </p>
      </section>
      <section>
        <h2>Video</h2>
        <video width="400" height="300" controls poster="images/photo1.jpg">
          <source src="images/video.MP4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Photo Showcase. All rights reserved.</p>
    </footer>
  </body>
</html>
